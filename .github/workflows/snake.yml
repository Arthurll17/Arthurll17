name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arthurll17
          outputs: |
            dist/github-snake.svg?color_snake=#39d353&color_dots=#161b22,#21262d,#30363d,#3b434b,#484f58
            dist/github-snake-dark.svg?color_snake=#39d353&color_dots=#161b22,#21262d,#30363d,#3b434b,#484f58

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
